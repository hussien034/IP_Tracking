<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <title>IP Tracker APP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
      integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A=="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div class="container hero__content">
          <span class="eyebrow">Global IP Insights</span>
          <h1>Track any IP address in real time</h1>
          <p class="hero__subtitle">
            Locate a device, verify provider information, and explore network
            location on a live map.
          </p>

          <form id="ip-search-form" class="search-form" novalidate>
            <div class="input-group">
              <input
                id="ip-search-input"
                type="search"
                class="form-control input-field"
                placeholder="Search for any IP address or domain"
                aria-label="Search for any IP address or domain"
              />
              <button type="submit" class="submit-btn" aria-label="Search">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </div>
            <small id="search-feedback" class="form-message" aria-live="polite">
              Enter an IPv4 address or a domain name.
            </small>
          </form>
        </div>
      </header>

      <section id="cont-info" aria-label="IP information panel">
        <div class="container info-panel">
          <div class="row">
            <div class="col-md-10 m-auto cont-items">
              <article class="info-card">
                <h2>IP ADDRESS</h2>
                <p class="ipAddressField">--</p>
              </article>
              <article class="info-card">
                <h2>LOCATION</h2>
                <p class="locationInput">--</p>
              </article>
              <article class="info-card">
                <h2>TIMEZONE</h2>
                <p class="timezoneInput">UTC</p>
              </article>
              <article class="info-card">
                <h2>ISP</h2>
                <p class="ispInput">--</p>
              </article>
            </div>
          </div>
        </div>
      </section>

      <section class="map-section" aria-label="Map section">
        <div id="map"></div>
      </section>
    </main>
    <script
      src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"
      integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
      crossorigin=""
    ></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
